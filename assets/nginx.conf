worker_processes 1;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    gzip on;
    gzip_types text/html text/css application/javascript;
    server {
        listen 0.0.0.0:${PORT};
        root /app;
        index index.html;
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
